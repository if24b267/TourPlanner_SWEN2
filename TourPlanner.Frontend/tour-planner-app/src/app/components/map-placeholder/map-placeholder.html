<div class="map-wrapper" [style.height]="height">
  <div #mapContainer class="leaflet-map"></div>
  <div class="map-fallback" *ngIf="!routeGeometryJson">
    <span class="map-icon">🗺️</span>
    <p>Noch keine Routendaten verfügbar</p>
    <small *ngIf="from && to">{{ from }} → {{ to }}</small>
  </div>
</div>
