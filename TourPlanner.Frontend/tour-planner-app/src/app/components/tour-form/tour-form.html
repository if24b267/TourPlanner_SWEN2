<div class="tour-form">
  <h2>Create New Tour</h2>
  
  <div *ngIf="errors.length > 0" class="error-messages">
    <div *ngFor="let error of errors" class="error">{{ error }}</div>
  </div>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Name *</label>
      <input [(ngModel)]="tour.name" name="name" required>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea [(ngModel)]="tour.tourDescription" name="description" rows="3"></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>From *</label>
        <input [(ngModel)]="tour.from" name="from" required>
      </div>

      <div class="form-group">
        <label>To *</label>
        <input [(ngModel)]="tour.to" name="to" required>
      </div>
    </div>

    <div class="form-group">
      <label>Transport Type</label>
      <select [(ngModel)]="tour.transportType" name="transportType">
        <option *ngFor="let type of transportTypes" [value]="type">{{ type }}</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Create Tour</button>
  </form>
</div>
