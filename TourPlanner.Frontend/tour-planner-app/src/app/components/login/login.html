<div class="login-container">
  <div class="login-card">
    <h2>{{ mode === 'login' ? 'Login' : 'Registrieren' }}</h2>

    <div *ngIf="authService.sessionExpired()" class="error">Sitzung abgelaufen, bitte erneut einloggen.</div>
    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username</label>
        <input [(ngModel)]="username" name="username" required>
      </div>
      <div class="form-group">
        <label>Passwort</label>
        <input type="password" [(ngModel)]="password" name="password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary">
        {{ mode === 'login' ? 'Einloggen' : 'Registrieren' }}
      </button>
    </form>

    <p class="toggle-link">
      {{ mode === 'login' ? 'Noch kein Konto?' : 'Bereits registriert?' }}
      <a (click)="toggleMode()">{{ mode === 'login' ? 'Registrieren' : 'Einloggen' }}</a>
    </p>
  </div>
</div>
