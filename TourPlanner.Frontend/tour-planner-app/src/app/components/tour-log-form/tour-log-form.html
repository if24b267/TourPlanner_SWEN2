<div class="log-form">
  <h4>{{ existingLog ? 'Edit Tour Log' : 'Add Tour Log' }}</h4>
  
  <div *ngIf="errors.length > 0" class="error-messages">
    <div *ngFor="let error of errors" class="error">{{ error }}</div>
  </div>

  <form (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group">
        <label>Difficulty (1-10)</label>
        <input type="number" [(ngModel)]="log.difficulty" name="difficulty" min="1" max="10">
      </div>
      
      <div class="form-group">
        <label>Rating (1-10)</label>
        <input type="number" [(ngModel)]="log.rating" name="rating" min="1" max="10">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Distance (km)</label>
        <input type="number" [(ngModel)]="log.totalDistance" name="distance" min="0" step="0.1">
      </div>
      
      <div class="form-group">
        <label>Time (hours)</label>
        <input type="number" [(ngModel)]="log.totalTimeHours" name="time" min="0" step="0.1">
      </div>
    </div>

    <div class="form-group">
      <label>Comment</label>
      <textarea [(ngModel)]="log.comment" name="comment" rows="2"></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{ existingLog ? 'Save Log' : 'Add Log' }}</button>
      <button type="button" (click)="onCancel()" class="btn btn-secondary">Cancel</button>
    </div>
  </form>
</div>
